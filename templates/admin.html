<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Project Scoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --admin-primary: #7c3aed;
            --admin-secondary: #db2777;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, var(--admin-primary) 0%, var(--admin-secondary) 100%);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .navbar-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .navbar-brand i {
            font-size: 28px;
        }

        .admin-badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            color: white;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-logout {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Container */
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Statistics Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-top: 4px solid;
            animation: fadeInUp 0.6s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card:nth-child(1) {
            border-top-color: var(--admin-primary);
            animation-delay: 0s;
        }

        .stat-card:nth-child(2) {
            border-top-color: var(--admin-secondary);
            animation-delay: 0.1s;
        }

        .stat-card:nth-child(3) {
            border-top-color: var(--success);
            animation-delay: 0.2s;
        }

        .stat-card:nth-child(4) {
            border-top-color: var(--warning);
            animation-delay: 0.3s;
        }

        .stat-card:nth-child(5) {
            border-top-color: var(--primary);
            animation-delay: 0.4s;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .stat-icon.purple {
            background: linear-gradient(135deg, var(--admin-primary) 0%, #6d28d9 100%);
            color: white;
        }

        .stat-icon.pink {
            background: linear-gradient(135deg, var(--admin-secondary) 0%, #be185d 100%);
            color: white;
        }

        .stat-icon.green {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
        }

        .stat-icon.orange {
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
            color: white;
        }

        .stat-icon.blue {
            background: linear-gradient(135deg, var(--primary) 0%, #2563eb 100%);
            color: white;
        }

        .stat-label {
            font-size: 13px;
            color: var(--gray);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--dark);
        }

        /* Content Card */
        .content-card {
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--light);
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title i {
            color: var(--admin-primary);
            font-size: 26px;
        }

        /* Search & Filter */
        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: var(--light);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--admin-primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 16px;
        }

        .btn-refresh {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--admin-primary) 0%, var(--admin-secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 12px;
        }

        .projects-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .projects-table thead th {
            background: linear-gradient(135deg, var(--admin-primary) 0%, var(--admin-secondary) 100%);
            color: white;
            padding: 16px 14px;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .projects-table thead th:first-child {
            border-radius: 12px 0 0 0;
        }

        .projects-table thead th:last-child {
            border-radius: 0 12px 0 0;
        }

        .projects-table tbody tr {
            background: white;
            transition: all 0.3s ease;
            border-bottom: 1px solid #f1f5f9;
        }

        .projects-table tbody tr:hover {
            background: #faf5ff;
            transform: scale(1.01);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.1);
        }

        .projects-table tbody tr:last-child {
            border-bottom: none;
        }

        .projects-table tbody td {
            padding: 16px 14px;
            font-size: 13px;
            color: var(--dark);
        }

        .projects-table tbody td:first-child {
            font-weight: 700;
            color: var(--admin-primary);
            font-size: 14px;
        }

        .projects-table .score {
            font-weight: 700;
            color: var(--success);
            font-size: 15px;
        }

        .projects-table .manday {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
        }

        /* Badges */
        .employee-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #e0e7ff 0%, #ddd6fe 100%);
            color: var(--admin-primary);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .complexity-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .complexity-high {
            background: #fee2e2;
            color: #991b1b;
        }

        .complexity-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .complexity-normal {
            background: #d1fae5;
            color: #065f46;
        }

        .progress-bar-container {
            width: 80px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, #34d399 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 72px;
            margin-bottom: 20px;
            opacity: 0.3;
            color: var(--admin-primary);
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--dark);
        }

        /* Loading State */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--admin-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .navbar-container {
                padding: 0 20px;
            }

            .navbar-brand span {
                display: none;
            }

            .container {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-section {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .table-container {
                overflow-x: scroll;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <i class="fas fa-shield-alt"></i>
                <span>Admin Dashboard</span>
            </div>
            <div class="navbar-actions">
                <span class="admin-badge">
                    <i class="fas fa-crown"></i> ADMIN
                </span>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>ออกจากระบบ</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon purple">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <div class="stat-label">จำนวนโครงการ</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon pink">
                    <i class="fas fa-trophy"></i>
                </div>
                <div class="stat-label">คะแนนรวม</div>
                <div class="stat-value" id="statTotalScore">0.00</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-star"></i>
                </div>
                <div class="stat-label">คะแนนสูงสุด</div>
                <div class="stat-value" id="statMaxScore">0.00</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon orange">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="stat-label">ความคืบหน้าเฉลี่ย</div>
                <div class="stat-value" id="statAvgProgress">0%</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="stat-label">Manday เฉลี่ย</div>
                <div class="stat-value" id="statAvgManday">0.00</div>
            </div>
        </div>

        <!-- Projects Table -->
        <div class="content-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-database"></i>
                    รายการโครงการทั้งหมด
                </h2>
            </div>

            <div class="filter-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อโครงการ, พนักงาน, รหัสพนักงาน...">
                </div>
                <button class="btn-refresh" onclick="loadProjects()">
                    <i class="fas fa-sync-alt"></i>
                    รีเฟรช
                </button>
            </div>

            <div class="table-container">
                <table class="projects-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ชื่อโครงการ</th>
                            <th>Contract No.</th>
                            <th>พนักงาน</th>
                            <th>รหัสพนักงาน</th>
                            <th>ลูกค้า</th>
                            <th>ประเภทงาน</th>
                            <th>PM Effort</th>
                            <th>Duration</th>
                            <th>Challenge</th>
                            <th>Progress</th>
                            <th>คะแนน</th>
                            <th>Manday</th>
                            <th>วันที่อัปเดต</th>
                        </tr>
                    </thead>
                    <tbody id="projectsList">
                        <tr>
                            <td colspan="14" class="empty-state">
                                <i class="fas fa-spinner fa-pulse"></i>
                                <h3>กำลังโหลดข้อมูล...</h3>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allProjects = [];

        // Show/Hide loading overlay
        function setLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // Load all projects
        async function loadProjects() {
            setLoading(true);
            
            try {
                const response = await fetch('/api/projects');
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to load projects');
                }

                allProjects = await response.json();
                displayProjects(allProjects);
            } catch (error) {
                console.error('Error loading projects:', error);
                showError('เกิดข้อผิดพลาดในการโหลดข้อมูล');
            } finally {
                setLoading(false);
            }
        }

        // Display projects
        function displayProjects(projects) {
            const tbody = document.getElementById('projectsList');
            tbody.innerHTML = '';

            if (projects.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="14" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>ไม่พบข้อมูลโครงการ</h3>
                            <p>ยังไม่มีโครงการในระบบหรือไม่พบข้อมูลที่ค้นหา</p>
                        </td>
                    </tr>
                `;
                return;
            }

            projects.forEach(project => {
                const row = document.createElement('tr');
                
                // Determine complexity level
                const isHigh = project.difficulty_project.includes('New Business') || 
                              project.difficulty_project.includes('Infrastructure');
                const isNormal = project.difficulty_project.includes('Service') || 
                                project.difficulty_project.includes('Hardware');
                const complexity = isHigh ? 'high' : (isNormal ? 'normal' : 'medium');
                const complexityText = isHigh ? 'High' : (isNormal ? 'Normal' : 'Medium');
                
                row.innerHTML = `
                    <td>${project.id}</td>
                    <td><strong>${project.project_name}</strong></td>
                    <td><small>${project.contract_no || '-'}</small></td>
                    <td>
                        <span class="employee-badge">
                            <i class="fas fa-user"></i>
                            ${project.first_name} ${project.last_name}
                        </span>
                    </td>
                    <td><strong>${project.employee_id}</strong></td>
                    <td><small>${project.difficulty_customer}</small></td>
                    <td>
                        <span class="complexity-badge complexity-${complexity}">
                            ${complexityText}
                        </span>
                        <br><small>${project.difficulty_project.substring(0, 20)}${project.difficulty_project.length > 20 ? '...' : ''}</small>
                    </td>
                    <td>${project.baseline_pm_effort}</td>
                    <td>${project.project_duration} ปี</td>
                    <td><small>${project.challenge_type === 'None' ? '-' : project.challenge_type.substring(0, 12)}</small></td>
                    <td>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: ${project.progress}%"></div>
                        </div>
                        <small>${project.progress.toFixed(0)}%</small>
                    </td>
                    <td class="score">${project.score.toFixed(2)}</td>
                    <td class="manday">${project.baseline_manday.toFixed(2)}</td>
                    <td><small>${project.updated_date.substring(0, 16)}</small></td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Search/Filter
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (!searchTerm) {
                displayProjects(allProjects);
                return;
            }

            const filtered = allProjects.filter(project => {
                return project.project_name.toLowerCase().includes(searchTerm) ||
                       project.first_name.toLowerCase().includes(searchTerm) ||
                       project.last_name.toLowerCase().includes(searchTerm) ||
                       project.employee_id.toLowerCase().includes(searchTerm) ||
                       project.username.toLowerCase().includes(searchTerm) ||
                       project.difficulty_customer.toLowerCase().includes(searchTerm) ||
                       project.difficulty_project.toLowerCase().includes(searchTerm);
            });

            displayProjects(filtered);
        });

        // Load statistics
        async function loadStatistics() {
            try {
                const response = await fetch('/api/statistics');
                const stats = await response.json();

                document.getElementById('statTotal').textContent = stats.total_projects;
                document.getElementById('statTotalScore').textContent = stats.total_score.toFixed(2);
                document.getElementById('statMaxScore').textContent = stats.highest_score.toFixed(2);
                document.getElementById('statAvgProgress').textContent = stats.average_progress.toFixed(0) + '%';
                document.getElementById('statAvgManday').textContent = stats.average_baseline_manday.toFixed(2);
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // Show error message
        function showError(message) {
            alert('❌ ' + message);
        }

        // Logout
        async function logout() {
            if (confirm('⚠️ คุณต้องการออกจากระบบ?')) {
                setLoading(true);
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            }
        }

        // Initial load
        (async function() {
            await Promise.all([
                loadProjects(),
                loadStatistics()
            ]);
        })();

        // Auto refresh every 30 seconds
        setInterval(() => {
            loadProjects();
            loadStatistics();
        }, 30000);

        // Keyboard shortcut: Ctrl+R to refresh
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                loadProjects();
            }
        });
    </script>
</body>
</html>
